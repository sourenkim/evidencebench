name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Validate benchmark
        run: evidencebench validate benchmark
      - name: Benchmark sanity run
        run: evidencebench benchmark benchmark --format json > benchmark-result.json
      - name: Check benchmark result is generated JSON
        run: python -c "import json; json.load(open('benchmark-result.json', encoding='utf-8'))"
