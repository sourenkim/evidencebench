[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evidencebench"
version = "0.1.0"
description = "An open-source testing framework for measuring whether AI-generated answers are supported by source documents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "EvidenceBench contributors" }]
keywords = ["ai", "evaluation", "grounding", "rag", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]
dev = [
  "evidencebench[pdf]",
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
evidencebench = "evidencebench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evidencebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long HTML/CSS literals and benchmark fixtures are kept readable as literals.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
